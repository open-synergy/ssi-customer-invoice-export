scenarios:
  - name: "Create Customer Invoice Export Type"
    steps:
      - step: "Create type"
        action: "create"
        model: "customer_invoice_export_type"
        save_as: "ctype"
        values:
          name: "Test Export Type"
          code: "TEXPT001"
          default_output_format: "csv"
          journal_selection_method: "manual"
          product_selection_method: "manual"
          parser_python_code: "result = []"

      - step: "Assert type created"
        action: "assert"
        target: "ctype"
        asserts:
          id:
            type: "value"
            operator: "is_truthy"
          name:
            type: "value"
            expected: "Test Export Type"
          default_output_format:
            type: "value"
            expected: "csv"
          journal_selection_method:
            type: "value"
            expected: "manual"
          product_selection_method:
            type: "value"
            expected: "manual"
          partner_selection_method:
            type: "value"
            expected: "domain"
          partner_domain:
            type: "value"
            expected: "[]"
          partner_python_code:
            type: "value"
            expected: "result = []"
          file_encoding:
            type: "value"
            expected: "utf-8"
          grouping_method:
            type: "value"
            expected: "invoice"

  - name: "Customer Invoice Export Type With Manual Partner Criteria"
    steps:
      - step: "Create type restricted to a single partner"
        action: "create"
        model: "customer_invoice_export_type"
        save_as: "ctype"
        values:
          name: "Partner Criteria Export Type"
          code: "TEXPT004"
          partner_selection_method: "manual"
          partner_ids:
            - - 6
              - 0
              - - "REF: base.res_partner_2"

      - step: "Assert partner criteria stored"
        action: "assert"
        target: "ctype"
        asserts:
          partner_selection_method:
            type: "value"
            expected: "manual"
          partner_ids:
            type: "m2m"
            check: "exact_xml_ids"
            expected_xml_ids:
              - "base.res_partner_2"

  - name: "Edit Customer Invoice Export Type Partner Selection Method"
    steps:
      - step: "Create type with default partner selection method"
        action: "create"
        model: "customer_invoice_export_type"
        save_as: "ctype"
        values:
          name: "Editable Partner Criteria Type"
          code: "TEXPT005"

      - step: "Assert default partner selection method"
        action: "assert"
        target: "ctype"
        asserts:
          partner_selection_method:
            type: "value"
            expected: "domain"

      - step: "Write partner selection method to manual"
        action: "write"
        target: "ctype"
        values:
          partner_selection_method: "manual"
          partner_ids:
            - - 6
              - 0
              - - "REF: base.res_partner_3"

      - step: "Assert partner selection method updated"
        action: "assert"
        target: "ctype"
        asserts:
          partner_selection_method:
            type: "value"
            expected: "manual"
          partner_ids:
            type: "m2m"
            check: "exact_xml_ids"
            expected_xml_ids:
              - "base.res_partner_3"

  - name: "Edit Customer Invoice Export Type Output Format"
    steps:
      - step: "Create type"
        action: "create"
        model: "customer_invoice_export_type"
        save_as: "ctype"
        values:
          name: "Editable Export Type"
          code: "TEXPT002"
          default_output_format: "csv"

      - step: "Write default_output_format to xlsx"
        action: "write"
        target: "ctype"
        values:
          default_output_format: "xlsx"
          xlsx_sheet_name: "Export"
          grouping_method: "partner"

      - step: "Assert output format updated"
        action: "assert"
        target: "ctype"
        asserts:
          default_output_format:
            type: "value"
            expected: "xlsx"
          xlsx_sheet_name:
            type: "value"
            expected: "Export"
          grouping_method:
            type: "value"
            expected: "partner"

  - name: "Delete Customer Invoice Export Type"
    steps:
      - step: "Create type"
        action: "create"
        model: "customer_invoice_export_type"
        save_as: "ctype"
        values:
          name: "Deletable Export Type"
          code: "TEXPT003"

      - step: "Delete type"
        action: "call"
        target: "ctype"
        method: "unlink"

      - step: "Verify type deleted"
        action: "search"
        model: "customer_invoice_export_type"
        domain: [["code", "=", "TEXPT003"]]
        save_as: "result"
        expect_count: 0
